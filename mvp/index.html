<title>iDuo Previewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#EDF1F2;
    --surface:#FFFFFF;
    --surface-2:#E2E8EA;
    --surface-3:#D6DDE0;
    --border:#CBD4D7;
    --ink:#12181A;
    --ink-muted:#5C6669;
    --accent:#0B8FA3;
    --accent-ink:#066B7A;
    --accent-soft:#DEF2F4;
    --zone-notch:#D64B72;
    --zone-notch-soft:rgba(214,75,114,.16);
    --zone-gesture:#C98A1E;
    --zone-gesture-soft:rgba(201,138,30,.18);
    --shadow:0 1px 2px rgba(18,24,26,.06), 0 10px 30px -12px rgba(18,24,26,.18);
    --chrome:#171C1E;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12171A;
      --surface:#1B2225;
      --surface-2:#242D30;
      --surface-3:#2E393C;
      --border:#38454A;
      --ink:#EDF1F1;
      --ink-muted:#93A0A3;
      --accent:#3FC6DA;
      --accent-ink:#3FC6DA;
      --accent-soft:#173A40;
      --zone-notch:#F17E9B;
      --zone-notch-soft:rgba(241,126,155,.2);
      --zone-gesture:#E3B24F;
      --zone-gesture-soft:rgba(227,178,79,.2);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.6);
      --chrome:#0C0F10;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12171A;
    --surface:#1B2225;
    --surface-2:#242D30;
    --surface-3:#2E393C;
    --border:#38454A;
    --ink:#EDF1F1;
    --ink-muted:#93A0A3;
    --accent:#3FC6DA;
    --accent-ink:#3FC6DA;
    --accent-soft:#173A40;
    --zone-notch:#F17E9B;
    --zone-notch-soft:rgba(241,126,155,.2);
    --zone-gesture:#E3B24F;
    --zone-gesture-soft:rgba(227,178,79,.2);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.6);
    --chrome:#0C0F10;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Archivo',ui-sans-serif,system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}

  .app{max-width:1180px;margin:0 auto;padding:28px 24px 64px;}

  /* header */
  .app-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;}
  .brand{display:flex;flex-direction:column;gap:4px;}
  .brand-name{display:flex;align-items:baseline;gap:6px;}
  .brand-mark{font-size:22px;font-weight:800;letter-spacing:-0.02em;}
  .brand-sub{font-size:22px;font-weight:500;color:var(--ink-muted);letter-spacing:-0.02em;}
  .brand-caption{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);}

  /* segmented control */
  .segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;}
  .segmented button{
    appearance:none;border:0;background:transparent;color:var(--ink-muted);
    font-family:inherit;font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:7px;
    cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  .segmented button.is-active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
  .segmented.small button{padding:6px 12px;font-size:12.5px;}
  .segmented button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* stage */
  .stage-section{display:flex;flex-direction:column;gap:12px;}
  .stage-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .toolbar-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tool-btn{
    display:inline-flex;align-items:center;gap:7px;
    appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    font-family:inherit;font-size:13px;font-weight:600;padding:8px 13px;border-radius:9px;cursor:pointer;
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .tool-btn svg{width:15px;height:15px;flex:none;}
  .tool-btn:hover{border-color:var(--accent);color:var(--accent-ink);}
  .tool-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);}
  .tool-btn.ghost{border-color:transparent;background:transparent;color:var(--ink-muted);}
  .tool-btn.ghost:hover{color:var(--ink);border-color:var(--border);background:var(--surface);}
  .tool-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .stage-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow);}
  .device-stage{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    min-height:clamp(300px,54vh,600px);
    padding:clamp(18px,4vw,44px);
    border-radius:12px;
    background-color:var(--bg);
    background-image:radial-gradient(var(--border) 1px, transparent 1px);
    background-size:22px 22px;
  }
  .device-frame{position:relative;flex:none;container-type:size;}

  /* inner-screen frame (real photo cutout) */
  .frame-rotator{position:absolute;}
  .frame-rotator.native{inset:0;}
  .frame-rotator.rotated{top:50%;left:50%;width:100cqh;height:100cqw;transform:translate(-50%,-50%) rotate(90deg);}
  .frame-chrome{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;user-select:none;-webkit-user-drag:none;}

  /* outer-screen frame (css-drawn bezel) */
  .frame-outer-bezel{position:absolute;inset:0;background:var(--chrome);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}

  .content-layer{
    position:absolute;overflow:hidden;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
  }
  .content-media{width:100%;height:100%;object-fit:contain;display:block;}
  .content-media.cover{object-fit:cover;}
  .content-iframe{width:100%;height:100%;border:0;background:#fff;display:block;}
  .pdf-canvas{display:block;}

  .content-state{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px;text-align:center;color:var(--ink-muted);}
  .content-state svg{width:34px;height:34px;opacity:.55;}
  .content-state .cs-title{font-size:13.5px;font-weight:600;color:var(--ink);}
  .content-state .cs-sub{font-size:12.5px;max-width:240px;}
  .content-state a{color:var(--accent-ink);font-weight:600;text-decoration:none;}
  .content-state a:hover{text-decoration:underline;}
  .spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @media (prefers-reduced-motion: reduce){.spinner{animation-duration:1.6s;}}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* safe-area overlay */
  .safe-overlay{position:absolute;inset:0;pointer-events:none;z-index:6;}
  .safe-overlay[hidden]{display:none;}
  .zone{position:absolute;}
  .zone-notch{background:var(--zone-notch-soft);background-image:repeating-linear-gradient(45deg, color-mix(in srgb, var(--zone-notch) 55%, transparent) 0 6px, transparent 6px 12px);}
  .zone-gesture{background:var(--zone-gesture-soft);background-image:repeating-linear-gradient(45deg, color-mix(in srgb, var(--zone-gesture) 55%, transparent) 0 6px, transparent 6px 12px);}
  .fold-line{position:absolute;background:repeating-linear-gradient(to right, var(--ink-muted) 0 5px, transparent 5px 10px);opacity:.55;}
  .fold-line.vertical{background:repeating-linear-gradient(to bottom, var(--ink-muted) 0 5px, transparent 5px 10px);}
  .island{position:absolute;background:#000;border-radius:999px;opacity:.92;}

  .spec-strip{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px;}
  .chip{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.02em;color:var(--ink-muted);
    background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:5px 11px;
  }
  .chip strong{color:var(--ink);font-weight:600;}

  .pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px;}
  .pager button{
    appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1;
  }
  .pager button:disabled{opacity:.35;cursor:default;}
  .pager span{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-muted);}

  .legend{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px;flex-wrap:wrap;}
  .legend[hidden]{display:none;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-muted);}
  .legend-swatch{width:10px;height:10px;border-radius:3px;flex:none;}

  .url-banner{font-size:12.5px;color:var(--ink-muted);text-align:center;}

  /* input section */
  .input-section{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:20px;}
  @media (max-width:760px){.input-section{grid-template-columns:1fr;}}
  .input-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;}
  .input-label{font-size:12.5px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.05em;}

  .dropzone{
    border:1.5px dashed var(--border);border-radius:12px;padding:26px 18px;text-align:center;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;transition:border-color .15s ease, background .15s ease;
  }
  .dropzone svg{width:26px;height:26px;color:var(--ink-muted);}
  .dropzone:hover,.dropzone:focus-visible{border-color:var(--accent);background:var(--accent-soft);}
  .dropzone.is-dragover{border-color:var(--accent);background:var(--accent-soft);}
  .dz-title{font-size:14px;font-weight:600;}
  .dz-sub{font-size:12.5px;color:var(--ink-muted);}
  .dz-sub .link{color:var(--accent-ink);font-weight:600;}

  .file-info{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface-2);}
  .file-info[hidden]{display:none;}
  .file-info svg{width:22px;height:22px;flex:none;color:var(--accent-ink);}
  .file-meta{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .file-meta span:first-child{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .muted{color:var(--ink-muted);font-size:11.5px;}
  .text-btn{appearance:none;border:0;background:transparent;color:var(--accent-ink);font-weight:600;font-size:12.5px;cursor:pointer;flex:none;}
  .text-btn:hover{text-decoration:underline;}

  .hint{font-size:11.5px;color:var(--ink-muted);}

  .url-row{display:flex;gap:8px;}
  #urlInput{
    flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;padding:10px 13px;
    font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);
  }
  #urlInput:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .primary-btn{
    appearance:none;border:0;background:var(--accent);color:#fff;font-family:inherit;font-weight:700;
    font-size:13.5px;padding:10px 18px;border-radius:10px;cursor:pointer;flex:none;
  }
  .primary-btn:hover{background:var(--accent-ink);}
  .primary-btn:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(0);
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:11px 18px;border-radius:10px;
    box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
  }
  .toast.is-visible{opacity:1;transform:translateX(-50%) translateY(-6px);}

  @media (max-width:560px){
    .app{padding:20px 14px 48px;}
    .brand-mark,.brand-sub{font-size:19px;}
    .device-stage{padding:14px;}
  }
</style>

<div class="app">
  <header class="app-header">
    <div class="brand">
      <div class="brand-name"><span class="brand-mark">iDuo</span><span class="brand-sub">Previewer</span></div>
      <span class="brand-caption">for iPhone Duo · 7.6″ 内屏 / 5.4″ 外屏</span>
    </div>
    <div class="segmented" data-group="screen" role="tablist" aria-label="选择屏幕">
      <button type="button" data-value="inner" class="is-active" role="tab" aria-selected="true">内屏</button>
      <button type="button" data-value="outer" role="tab" aria-selected="false">外屏</button>
    </div>
  </header>

  <main class="stage-section">
    <div class="stage-toolbar">
      <div class="toolbar-group">
        <button type="button" id="btnOrientation" class="tool-btn" title="切换横竖屏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2" width="10" height="20" rx="2.4"/><line x1="10" y1="18.3" x2="14" y2="18.3"/></svg>
          <span id="orientationLabel">横屏</span>
        </button>
        <div class="segmented small" data-group="fill">
          <button type="button" data-value="contain" class="is-active">适应</button>
          <button type="button" data-value="cover">填满</button>
        </div>
        <button type="button" id="btnSafeArea" class="tool-btn" title="显示安全区" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="2.6"/></svg>
          <span>安全区</span>
        </button>
      </div>
      <button type="button" id="btnReset" class="tool-btn ghost" title="清空重置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        <span>重置</span>
      </button>
    </div>

    <div class="stage-card">
      <div class="device-stage" id="deviceStage">
        <div class="device-frame" id="deviceFrame"></div>
      </div>
      <div class="pager" id="pager" hidden>
        <button type="button" id="pagerPrev" aria-label="上一页">‹</button>
        <span id="pagerLabel" class="mono">1 / 1</span>
        <button type="button" id="pagerNext" aria-label="下一页">›</button>
      </div>
      <div class="spec-strip" id="specStrip"></div>
      <div class="legend" id="legend" hidden>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--zone-notch)"></span>刘海 / 灵动岛区域</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--zone-gesture)"></span>手势条区域</div>
        <div class="legend-item"><span class="legend-swatch" style="background:var(--ink-muted)"></span>折叠线（非安全区限制，仅示意）</div>
      </div>
    </div>
  </main>

  <section class="input-section">
    <div class="input-card">
      <span class="input-label">上传文件</span>
      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="上传图片或 PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 16V4M12 4 7 9M12 4l5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <p class="dz-title">拖拽图片或 PDF 到此处</p>
        <p class="dz-sub">或 <span class="link">点击选择文件</span> · JPG / PNG / WebP / GIF / SVG / PDF</p>
        <input type="file" id="fileInput" accept="image/*,application/pdf" hidden>
      </div>
      <div class="file-info" id="fileInfo" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
        <div class="file-meta"><span id="fileName"></span><span id="fileSize" class="muted"></span></div>
        <button type="button" class="text-btn" id="btnChangeFile">更换文件</button>
      </div>
      <p class="hint">文件仅在你的浏览器本地渲染，不会上传到服务器。</p>
    </div>

    <div class="input-card">
      <label class="input-label" for="urlInput">输入网页地址</label>
      <div class="url-row">
        <input type="text" id="urlInput" class="mono" placeholder="example.com" autocomplete="off" spellcheck="false">
        <button type="button" class="primary-btn" id="btnGo">预览</button>
      </div>
      <p class="hint">受浏览器安全策略限制，部分网站可能拒绝被嵌入预览，此时可点击"在新标签页打开"查看。</p>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs';

/* ---------- 工具函数 ---------- */
function fmtBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(1) + ' MB';
}
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('is-visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove('is-visible'), 3200);
}
function currentScreen(){ return SCREENS[state.screenMode]; }
function currentOrientation(){ return state.orientation[state.screenMode]; }
function currentAspect(){
  const { w, h } = currentScreen().resolution;
  return currentOrientation() === 'portrait' ? { w, h } : { w: h, h: w };
}

/* ---------- 布局：让 device-frame 按当前宽高比在舞台内 contain-fit ---------- */
function fitFrame(){
  const cs = getComputedStyle(deviceStage);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const availW = Math.max(deviceStage.clientWidth - padX, 0);
  const availH = Math.max(deviceStage.clientHeight - padY, 0);
  const { w, h } = currentAspect();
  const ratio = w / h;
  let boxW = availW, boxH = boxW / ratio;
  if (boxH > availH) { boxH = availH; boxW = boxH * ratio; }
  deviceFrame.style.width = boxW + 'px';
  deviceFrame.style.height = boxH + 'px';
}

/* ---------- 构建设备框骨架（切换屏幕/方向时重建一次） ---------- */
function buildFrameSkeleton(){
  const screen = currentScreen();
  const orientation = currentOrientation();
  deviceFrame.innerHTML = '';

  if (screen.hasFrameImage){
    const rotator = document.createElement('div');
    rotator.className = 'frame-rotator ' + (orientation === 'portrait' ? 'rotated' : 'native');

    const content = document.createElement('div');
    content.className = 'content-layer';
    content.style.top = screen.holePad.top + '%';
    content.style.bottom = screen.holePad.bottom + '%';
    content.style.left = screen.holePad.left + '%';
    content.style.right = screen.holePad.right + '%';
    content.appendChild(buildSafeOverlay());

    const img = document.createElement('img');
    img.className = 'frame-chrome';
    img.src = FRAME_IMG_SRC;
    img.alt = '';

    rotator.appendChild(content);
    rotator.appendChild(img);
    deviceFrame.appendChild(rotator);
    contentLayerEl = content;
  } else {
    const bezel = document.createElement('div');
    bezel.className = 'frame-outer-bezel';
    // corner 配置以 360px 参考宽度标定，渲染时按实际帧宽等比缩放
    const frameW = parseFloat(deviceFrame.style.width) || 300;
    const cornerScale = frameW / 360;
    const cRaw = screen.corner[orientation];
    const c = { tl: cRaw.tl * cornerScale, tr: cRaw.tr * cornerScale, br: cRaw.br * cornerScale, bl: cRaw.bl * cornerScale };
    bezel.style.borderRadius = `${c.tl}px ${c.tr}px ${c.br}px ${c.bl}px`;

    const bezelPx = Math.max(6, frameW * screen.bezelRatio);
    bezel.style.padding = bezelPx + 'px';

    const content = document.createElement('div');
    content.className = 'content-layer';
    content.style.inset = '0';
    content.style.borderRadius = `${Math.max(c.tl-bezelPx,0)}px ${Math.max(c.tr-bezelPx,0)}px ${Math.max(c.br-bezelPx,0)}px ${Math.max(c.bl-bezelPx,0)}px`;
    content.appendChild(buildSafeOverlay());

    bezel.appendChild(content);
    deviceFrame.appendChild(bezel);
    contentLayerEl = content;
  }

  contentMountEl = document.createElement('div');
  contentMountEl.className = 'content-mount';
  contentMountEl.style.cssText = 'position:absolute;inset:0;z-index:1;';
  contentLayerEl.insertBefore(contentMountEl, contentLayerEl.firstChild);

  renderSafeOverlayGeometry();
  mountContent();
}

function buildSafeOverlay(){
  const overlay = document.createElement('div');
  overlay.className = 'safe-overlay';
  overlay.hidden = !state.safeAreaOn;
  overlay.id = 'safeOverlay';

  const top = document.createElement('div'); top.className = 'zone zone-notch zone-top';
  const bottom = document.createElement('div'); bottom.className = 'zone zone-gesture zone-bottom';
  const left = document.createElement('div'); left.className = 'zone zone-gesture zone-left';
  const right = document.createElement('div'); right.className = 'zone zone-gesture zone-right';
  overlay.append(top, bottom, left, right);

  const screen = currentScreen();
  if (!screen.hasIsland){
    const fold = document.createElement('div');
    fold.className = 'fold-line';
    overlay.appendChild(fold);
  } else {
    const island = document.createElement('div');
    island.className = 'island';
    overlay.appendChild(island);
  }
  return overlay;
}

function renderSafeOverlayGeometry(){
  const overlay = document.getElementById('safeOverlay');
  if (!overlay) return;
  const screen = currentScreen();
  const orientation = currentOrientation();
  const sa = screen.safeArea[orientation];

  const top = overlay.querySelector('.zone-top');
  const bottom = overlay.querySelector('.zone-bottom');
  const left = overlay.querySelector('.zone-left');
  const right = overlay.querySelector('.zone-right');

  top.style.cssText += `top:0;left:0;right:0;height:${sa.top}%;`;
  bottom.style.cssText += `bottom:0;left:0;right:0;height:${sa.bottom}%;`;
  left.style.cssText += `top:0;bottom:0;left:0;width:${sa.left}%;`;
  right.style.cssText += `top:0;bottom:0;right:0;width:${sa.right}%;`;

  if (!screen.hasIsland){
    const fold = overlay.querySelector('.fold-line');
    const dir = screen.fold[orientation];
    fold.classList.toggle('vertical', dir === 'vertical');
    if (dir === 'horizontal'){
      fold.style.cssText = 'left:0;right:0;top:50%;height:2px;transform:translateY(-1px);';
      fold.classList.remove('vertical');
    } else {
      fold.style.cssText = 'top:0;bottom:0;left:50%;width:2px;transform:translateX(-1px);';
    }
  } else {
    const island = overlay.querySelector('.island');
    const edge = screen.islandEdge[orientation];
    if (edge === 'top'){
      island.style.cssText = `top:${sa.top*0.28}%;left:50%;transform:translateX(-50%);width:26%;height:${sa.top*0.5}%;`;
    } else if (edge === 'right'){
      island.style.cssText = `right:${sa.right*0.28}%;top:50%;transform:translateY(-50%);height:26%;width:${sa.right*0.5}%;`;
    } else if (edge === 'left'){
      island.style.cssText = `left:${sa.left*0.28}%;top:50%;transform:translateY(-50%);height:26%;width:${sa.left*0.5}%;`;
    } else {
      island.style.cssText = `bottom:${sa.bottom*0.28}%;left:50%;transform:translateX(-50%);width:26%;height:${sa.bottom*0.5}%;`;
    }
  }
}

/* ---------- 内容渲染（仅在 source 变化 / 屏幕尺寸变化时调用） ---------- */
function renderContentState(kind, opts = {}){
  contentMountEl.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'content-state';
  if (kind === 'empty'){
    wrap.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 15 5-5 4 4 3-3 6 6"/><circle cx="8" cy="9" r="1.3"/></svg>
      <div class="cs-title">还没有内容</div>
      <div class="cs-sub">上传图片 / PDF，或在下方输入网址开始预览</div>`;
  } else if (kind === 'loading'){
    wrap.innerHTML = `<div class="spinner"></div><div class="cs-title">${opts.text || '加载中…'}</div>`;
  } else if (kind === 'error'){
    wrap.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
      <div class="cs-title">${opts.title || '加载失败'}</div>
      <div class="cs-sub">${opts.sub || ''}</div>`;
  } else if (kind === 'blocked'){
    wrap.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
      <div class="cs-title">该网站可能拒绝被嵌入预览</div>
      <div class="cs-sub">部分网站出于安全策略禁止被 iframe 嵌入，这是浏览器限制，并非本工具故障</div>
      <a href="${opts.url}" target="_blank" rel="noopener noreferrer">在新标签页打开 ↗</a>`;
  }
  contentMountEl.appendChild(wrap);
}

function mountContent(){
  if (!contentMountEl) return;
  const src = state.source;
  contentMountEl.innerHTML = '';
  pager.hidden = true;

  if (!src){ renderContentState('empty'); return; }

  if (src.type === 'image'){
    const img = document.createElement('img');
    img.className = 'content-media' + (state.fillMode === 'cover' ? ' cover' : '');
    img.src = src.objectUrl;
    contentMountEl.appendChild(img);
    return;
  }

  if (src.type === 'pdf'){
    if (src.loadState === 'loading'){ renderContentState('loading', { text: '解析 PDF 中…' }); return; }
    if (src.loadState === 'error'){ renderContentState('error', { title: 'PDF 无法解析', sub: '文件可能已加密或已损坏' }); return; }
    const canvas = document.createElement('canvas');
    canvas.className = 'pdf-canvas';
    contentMountEl.appendChild(canvas);
    renderPdfPage();
    if (src.totalPages > 1){
      pager.hidden = false;
      updatePagerLabel();
    }
    return;
  }

  if (src.type === 'url'){
    if (src.loadState === 'loading'){ renderContentState('loading', { text: '加载网页中…' }); return; }
    if (src.loadState === 'blocked'){ renderContentState('blocked', { url: src.value }); return; }
    const iframe = document.createElement('iframe');
    iframe.className = 'content-iframe';
    iframe.src = src.value;
    iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');
    iframe.setAttribute('referrerpolicy', 'no-referrer');
    contentMountEl.appendChild(iframe);
  }
}

async function renderPdfPage(){
  const src = state.source;
  if (!src || src.type !== 'pdf' || !src.pdfDoc || !contentMountEl) return;
  const canvas = contentMountEl.querySelector('canvas.pdf-canvas');
  if (!canvas) return;
  const page = await src.pdfDoc.getPage(src.currentPage);
  const base = page.getViewport({ scale: 1 });
  const rect = contentLayerEl.getBoundingClientRect();
  if (rect.width < 4 || rect.height < 4) return;
  const scaleX = rect.width / base.width, scaleY = rect.height / base.height;
  const fitScale = state.fillMode === 'cover' ? Math.max(scaleX, scaleY) : Math.min(scaleX, scaleY);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const viewport = page.getViewport({ scale: fitScale * dpr });
  canvas.width = Math.max(1, Math.round(viewport.width));
  canvas.height = Math.max(1, Math.round(viewport.height));
  canvas.style.width = (viewport.width / dpr) + 'px';
  canvas.style.height = (viewport.height / dpr) + 'px';
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
}

function updatePagerLabel(){
  const src = state.source;
  pagerLabel.textContent = `${src.currentPage} / ${src.totalPages}`;
  pagerPrev.disabled = src.currentPage <= 1;
  pagerNext.disabled = src.currentPage >= src.totalPages;
}

/* ---------- 规格条 ---------- */
function renderSpecStrip(){
  const screen = currentScreen();
  const { w, h } = screen.resolution;
  specStrip.innerHTML = `
    <span class="chip"><strong>${screen.label}</strong></span>
    <span class="chip">${w} × ${h} px</span>
    <span class="chip">${screen.ppi} ppi</span>
    <span class="chip">${screen.diagonal}″</span>`;
}

/* ---------- 文件处理 ---------- */
function revokeCurrentSource(){
  if (state.source && state.source.type === 'image' && state.source.objectUrl){
    URL.revokeObjectURL(state.source.objectUrl);
  }
}

function handleFiles(fileList){
  const file = fileList && fileList[0];
  if (!file) return;
  if (file.type.startsWith('image/')){
    if (file.size > 50 * 1024 * 1024){ showToast('图片超过 50MB 限制'); return; }
    revokeCurrentSource();
    const objectUrl = URL.createObjectURL(file);
    state.source = { type: 'image', name: file.name, size: file.size, objectUrl };
    showFileInfo(file);
    mountContent();
  } else if (file.type === 'application/pdf'){
    if (file.size > 80 * 1024 * 1024){ showToast('PDF 超过 80MB 限制'); return; }
    revokeCurrentSource();
    state.source = { type: 'pdf', name: file.name, size: file.size, loadState: 'loading', currentPage: 1, totalPages: 0, pdfDoc: null };
    showFileInfo(file);
    mountContent();
    loadPdf(file);
  } else {
    showToast('不支持的文件格式，请上传图片或 PDF');
  }
}

async function loadPdf(file){
  try{
    const buf = await file.arrayBuffer();
    const doc = await pdfjsLib.getDocument({ data: buf }).promise;
    if (state.source && state.source.name === file.name){
      state.source.pdfDoc = doc;
      state.source.totalPages = doc.numPages;
      state.source.loadState = 'loaded';
      mountContent();
    }
  } catch(e){
    if (state.source && state.source.name === file.name){
      state.source.loadState = 'error';
      mountContent();
    }
  }
}

function showFileInfo(file){
  fileNameEl.textContent = file.name;
  fileSizeEl.textContent = fmtBytes(file.size);
  fileInfo.hidden = false;
  dropzone.hidden = true;
}

function clearFileInfo(){
  fileInfo.hidden = true;
  dropzone.hidden = false;
  fileInput.value = '';
}

/* ---------- 网址处理 ---------- */
function normalizeUrl(raw){
  let v = raw.trim();
  if (!v) return null;
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  try{ new URL(v); return v; } catch(e){ return null; }
}

function loadUrl(){
  const url = normalizeUrl(urlInput.value);
  if (!url){ showToast('请输入有效的网址'); return; }
  revokeCurrentSource();
  clearFileInfo();
  state.source = { type: 'url', value: url, loadState: 'loading' };
  mountContent();

  let settled = false;
  const timer = setTimeout(() => {
    if (settled || !state.source || state.source.value !== url) return;
    settled = true;
    state.source.loadState = 'blocked';
    mountContent();
  }, 6000);

  const check = () => {
    if (settled || !state.source || state.source.value !== url) return;
    const iframe = contentMountEl && contentMountEl.querySelector('iframe.content-iframe');
    if (!iframe) return;
    iframe.addEventListener('load', () => {
      if (settled || !state.source || state.source.value !== url) return;
      settled = true;
      clearTimeout(timer);
      state.source.loadState = 'loaded';
    }, { once: true });
  };
  requestAnimationFrame(check);
}

/* ---------- 顶层重渲染（切屏幕 / 切方向） ---------- */
function fullRebuild(){
  fitFrame();
  buildFrameSkeleton();
  renderSpecStrip();
}

function refitAndRedraw(){
  fitFrame();
  renderSafeOverlayGeometry();
  if (state.source && state.source.type === 'pdf' && state.source.loadState === 'loaded'){
    renderPdfPage();
  }
}

/* ---------- 事件绑定 ---------- */
document.querySelectorAll('.segmented[data-group="screen"] button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.value === state.screenMode) return;
    document.querySelectorAll('.segmented[data-group="screen"] button').forEach(b => {
      b.classList.toggle('is-active', b === btn);
      b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
    });
    state.screenMode = btn.dataset.value;
    orientationLabel.textContent = state.orientation[state.screenMode] === 'portrait' ? '竖屏' : '横屏';
    fullRebuild();
  });
});

document.querySelectorAll('.segmented[data-group="fill"] button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.value === state.fillMode) return;
    document.querySelectorAll('.segmented[data-group="fill"] button').forEach(b => b.classList.toggle('is-active', b === btn));
    state.fillMode = btn.dataset.value;
    const media = contentMountEl && contentMountEl.querySelector('img.content-media');
    if (media) media.classList.toggle('cover', state.fillMode === 'cover');
    if (state.source && state.source.type === 'pdf' && state.source.loadState === 'loaded') renderPdfPage();
  });
});

btnOrientation.addEventListener('click', () => {
  const mode = state.screenMode;
  state.orientation[mode] = state.orientation[mode] === 'portrait' ? 'landscape' : 'portrait';
  orientationLabel.textContent = state.orientation[mode] === 'portrait' ? '竖屏' : '横屏';
  fullRebuild();
});

btnSafeArea.addEventListener('click', () => {
  state.safeAreaOn = !state.safeAreaOn;
  btnSafeArea.setAttribute('aria-pressed', String(state.safeAreaOn));
  legend.hidden = !state.safeAreaOn;
  const overlay = document.getElementById('safeOverlay');
  if (overlay) overlay.hidden = !state.safeAreaOn;
});

btnReset.addEventListener('click', () => {
  revokeCurrentSource();
  state.source = null;
  clearFileInfo();
  urlInput.value = '';
  state.fillMode = 'contain';
  document.querySelectorAll('.segmented[data-group="fill"] button').forEach(b => b.classList.toggle('is-active', b.dataset.value === 'contain'));
  mountContent();
});

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fileInput.click(); } });
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('is-dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('is-dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('is-dragover');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
btnChangeFile.addEventListener('click', () => { revokeCurrentSource(); state.source = null; clearFileInfo(); mountContent(); });

btnGo.addEventListener('click', loadUrl);
urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadUrl(); });

pagerPrev.addEventListener('click', () => {
  if (!state.source || state.source.currentPage <= 1) return;
  state.source.currentPage -= 1;
  updatePagerLabel();
  renderPdfPage();
});
pagerNext.addEventListener('click', () => {
  if (!state.source || state.source.currentPage >= state.source.totalPages) return;
  state.source.currentPage += 1;
  updatePagerLabel();
  renderPdfPage();
});

let resizeRaf = null;
window.addEventListener('resize', () => {
  cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(refitAndRedraw);
});
if (window.ResizeObserver){
  new ResizeObserver(() => {
    cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(refitAndRedraw);
  }).observe(deviceStage);
}

/* ---------- 初始化 ---------- */
fullRebuild();
</script>
